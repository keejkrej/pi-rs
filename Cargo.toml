[workspace]
members = [
  "crates/pi-core",
  "crates/pi-openai",
  "crates/pi-acp",
  "crates/pi-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Jack"]

[workspace.dependencies]
agent-client-protocol = { version = "0.10.4", features = ["unstable", "unstable_auth_methods", "unstable_logout", "unstable_message_id"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
dirs = "6.0.0"
futures = "0.3.31"
glob = "0.3.3"
regex = "1.11.3"
reqwest = { version = "0.12.23", default-features = false, features = ["charset", "http2", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
webbrowser = "1.0.6"
